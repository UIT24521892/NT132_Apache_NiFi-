# /etc/vsftpd.conf — VM3 ftp.lab (NT132). Sinh bởi infra/ftp/setup_vm3.sh.
# __PASV_ADDRESS__ được thay bằng IP lab của VM3 khi cài; không sửa tay trong repo.
listen=YES
listen_ipv6=NO

# Chỉ tài khoản cục bộ có tên trong /etc/vsftpd.userlist (SPECS 4.4)
anonymous_enable=NO
local_enable=YES
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
pam_service_name=vsftpd

# clock_uploader được ghi/rename; nifi_fetch bị ghi đè write_enable=NO trong user_config_dir
write_enable=YES
local_umask=027
user_config_dir=/etc/vsftpd/users

# Chroot vào /srv/ftp/nt132 (root:root 0755, không writable); inbox là /checkin
chroot_local_user=YES
local_root=/srv/ftp/nt132
secure_chroot_dir=/var/run/vsftpd/empty

# Passive cho NiFi ListFTP/FetchFTP và simulator (SPECS 4.3)
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40010
pasv_address=__PASV_ADDRESS__

# Log truyền file để làm evidence; không ghi lệnh protocol (tránh lộ dữ liệu đăng nhập)
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=NO
dirmessage_enable=NO
use_localtime=YES

# FTP thường chỉ trong mạng lab cô lập; FTPS là mở rộng sau baseline
ssl_enable=NO
